<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK_Thomas</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #7fff6e;
    --accent2: #ff6ef7;
    --text: #e8e8f0;
    --muted: #555570;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* GRID NOISE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(127,255,110,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,255,110,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
    letter-spacing: -1px;
    cursor: pointer;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo:hover { opacity: 0.75; }
  .logo span { color: #ffffff; }
  .logo-img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #2dd4c033;
    display: block;
  }
  .logo-img-placeholder {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px dashed #2dd4c055;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    color: #2dd4c066;
    letter-spacing: 0;
    flex-shrink: 0;
    font-family: 'Space Mono', monospace;
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    text-align: center;
    padding: 14px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: #fff;
    letter-spacing: 0.15em;
    border-top: 1px solid var(--border);
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
  }
  footer span { color: #fff; }

  #page-home {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 100px 40px 80px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .home-title {
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 800;
    line-height: 1;
    margin-bottom: 0;
    margin-top: 20px;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 60px;
    max-width: 900px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 40px 32px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.25s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(127,255,110,0.07), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .card:hover::before { opacity: 1; }

  .card-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .card-desc {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }
  .card-arrow {
    position: absolute;
    bottom: 24px; right: 28px;
    font-size: 1.4rem;
    color: var(--accent);
    opacity: 0;
    transform: translate(-6px, 6px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .card:hover .card-arrow { opacity: 1; transform: translate(0,0); }

  /* ===== SOUND VISUALIZER PAGE ===== */
  #page-visualizer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    padding: 100px 40px 80px;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  #page-visualizer.active { display: flex; }

  .vis-title {
    font-size: 1rem;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.2em;
    margin-bottom: 40px;
    text-transform: uppercase;
  }

  .vis-controls {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    padding: 10px 22px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.1em;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
  }
  .btn:hover, .btn.active {
    border-color: var(--accent);
    background: rgba(127,255,110,0.1);
    color: var(--accent);
  }
  .btn.danger { border-color: #ff4e4e44; }
  .btn.danger:hover { border-color: #ff4e4e; background: rgba(255,78,78,0.1); color: #ff4e4e; }

  #canvas-wrap {
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }
  canvas { display: block; width: 100%; height: 300px; }

  #page-home { display: none; }
  #page-home.active { display: flex; }

  .vis-mode-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 12px;
    letter-spacing: 0.2em;
  }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 8px;
    vertical-align: middle;
    transition: background 0.3s;
  }
  .status-dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="pw-screen" style="
  position: fixed; inset: 0; z-index: 9999;
  background: #0a0a0f;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
">
  <div style="font-family:'Space Mono',monospace; font-size:1.4rem; color:#fff; letter-spacing:0.1em;">TK_Thomas</div>
  <div style="font-family:'Space Mono',monospace; font-size:0.7rem; color:#555570; letter-spacing:0.2em; margin-bottom:8px;">PASSWORT EINGEBEN</div>
  <input id="pw-input" type="password" placeholder="••••••" autofocus
    style="
      background: #111118; border: 1px solid #1e1e2e;
      color: #fff; font-family: 'Space Mono', monospace;
      font-size: 1rem; padding: 12px 24px; border-radius: 2px;
      outline: none; text-align: center; letter-spacing: 0.3em;
      width: 220px; transition: border-color 0.2s;
    "
    onkeydown="if(event.key==='Enter') checkPw()"
    oninput="this.style.borderColor='#1e1e2e'"
  >
  <div id="pw-error" style="font-family:'Space Mono',monospace; font-size:0.65rem; color:#ff4e4e; letter-spacing:0.15em; height:16px;"></div>
  <button onclick="checkPw()" style="
    font-family:'Space Mono',monospace; font-size:0.75rem;
    padding: 10px 28px; border: 1px solid #1e1e2e;
    background: #111118; color: #fff; cursor: pointer;
    border-radius: 2px; letter-spacing: 0.1em;
    transition: border-color 0.2s;
  " onmouseover="this.style.borderColor='#fff'" onmouseout="this.style.borderColor='#1e1e2e'">ENTER</button>
</div>

<script>
  function checkPw() {
    const input = document.getElementById('pw-input');
    if (input.value === 'TK') {
      document.getElementById('pw-screen').style.display = 'none';
    } else {
      input.style.borderColor = '#ff4e4e';
      document.getElementById('pw-error').textContent = 'FALSCHES PASSWORT';
      input.value = '';
      setTimeout(() => {
        document.getElementById('pw-error').textContent = '';
      }, 2000);
    }
  }
</script>

<header>
  <div class="logo" onclick="goHome()"><!-- Ersetze den Platzhalter mit: <img src="DEIN_BILD_LINK" class="logo-img" alt="TK_Thomas"> -->
    <div class="logo-img-placeholder">IMG</div>TK<span>_</span>Thomas</div>
</header>

<footer>Made by <span>TK_Thomas</span></footer>

<!-- HOME -->
<div id="page-home" class="active">
  <div class="home-title">Projects</div>

  <div class="projects-grid">
    <div class="card" onclick="showVisualizer()">
      <div class="card-title">Sound<br>Visualizer</div>
      <div class="card-desc">Mic-based real-time audio visualization with multiple render modes.</div>
      <div class="card-arrow">↗</div>
    </div>

    <a class="card" href="https://tk-thomas.github.io/rezepte/" target="_blank">
      <div class="card-title">Rezepte</div>
      <div class="card-desc">Eine Sammlung meiner liebsten Rezepte.</div>
      <div class="card-arrow">↗</div>
    </a>
  </div>
</div>

<!-- VISUALIZER -->
<div id="page-visualizer">
  <div class="vis-title"><span class="status-dot" id="dot"></span>Sound Visualizer</div>

  <div class="vis-controls">
    <button class="btn" id="btn-start" onclick="startMic()">▶ Start</button>
    <button class="btn danger" id="btn-stop" onclick="stopMic()" style="display:none">■ Stop</button>
    <button class="btn active" id="mode-bars" onclick="setMode('bars')">Bars</button>
    <button class="btn" id="mode-wave" onclick="setMode('wave')">Wave</button>
    <button class="btn" id="mode-circle" onclick="setMode('circle')">Circle</button>
  </div>

  <div id="canvas-wrap">
    <canvas id="vis-canvas"></canvas>
  </div>
  <div class="vis-mode-label" id="mode-label">MODE: BARS</div>
</div>

<script>
  // ---- Navigation ----
  function goHome() {
    document.getElementById('page-home').classList.add('active');
    document.getElementById('page-visualizer').classList.remove('active');
    stopMic();
  }
  function showVisualizer() {
    document.getElementById('page-home').classList.remove('active');
    document.getElementById('page-visualizer').classList.add('active');
  }

  // ---- Visualizer ----
  const canvas = document.getElementById('vis-canvas');
  const ctx = canvas.getContext('2d');
  let audioCtx, analyser, source, stream, raf;
  let mode = 'bars';

  function resize() {
    canvas.width = canvas.offsetWidth * window.devicePixelRatio;
    canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  }
  window.addEventListener('resize', resize);
  resize();

  function setMode(m) {
    mode = m;
    document.querySelectorAll('[id^="mode-"]').forEach(b => b.classList.remove('active'));
    document.getElementById('mode-' + m).classList.add('active');
    document.getElementById('mode-label').textContent = 'MODE: ' + m.toUpperCase();
  }

  async function startMic() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = '';
      document.getElementById('dot').classList.add('live');
      draw();
    } catch(e) {
      alert('Kein Mikrofon-Zugriff: ' + e.message);
    }
  }

  function stopMic() {
    if (raf) cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    audioCtx = analyser = source = stream = null;
    document.getElementById('btn-start').style.display = '';
    document.getElementById('btn-stop').style.display = 'none';
    document.getElementById('dot').classList.remove('live');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  function draw() {
    raf = requestAnimationFrame(draw);
    const W = canvas.width, H = canvas.height;
    const buf = new Uint8Array(analyser.frequencyBinCount);

    ctx.clearRect(0, 0, W, H);

    if (mode === 'bars') {
      analyser.getByteFrequencyData(buf);
      const bw = W / buf.length;
      for (let i = 0; i < buf.length; i++) {
        const h = (buf[i] / 255) * H;
        const hue = 100 + (buf[i] / 255) * 200;
        ctx.fillStyle = `hsl(${hue}, 90%, 60%)`;
        ctx.fillRect(i * bw, H - h, bw - 1, h);
      }
    } else if (mode === 'wave') {
      analyser.getByteTimeDomainData(buf);
      ctx.beginPath();
      ctx.strokeStyle = '#7fff6e';
      ctx.lineWidth = 2 * window.devicePixelRatio;
      const step = W / buf.length;
      for (let i = 0; i < buf.length; i++) {
        const y = (buf[i] / 128) * (H / 2);
        i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * step, y);
      }
      ctx.stroke();
    } else if (mode === 'circle') {
      analyser.getByteFrequencyData(buf);
      const cx = W / 2, cy = H / 2;
      const r = Math.min(W, H) * 0.22;
      for (let i = 0; i < buf.length; i++) {
        const angle = (i / buf.length) * Math.PI * 2 - Math.PI / 2;
        const len = (buf[i] / 255) * r;
        const x1 = cx + Math.cos(angle) * r;
        const y1 = cy + Math.sin(angle) * r;
        const x2 = cx + Math.cos(angle) * (r + len);
        const y2 = cy + Math.sin(angle) * (r + len);
        const hue = 100 + (i / buf.length) * 260;
        ctx.beginPath();
        ctx.strokeStyle = `hsl(${hue}, 85%, 60%)`;
        ctx.lineWidth = 2 * window.devicePixelRatio;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
    }
  }
</script>
</body>
</html>
