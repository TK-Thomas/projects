<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK_Thomas</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --accent: #7fff6e;
    --accent2: #ff6ef7;
    --text: #e8e8f0;
    --muted: #555570;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(127,255,110,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,255,110,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem; font-weight: 700;
    color: #fff; text-decoration: none;
    letter-spacing: -1px; cursor: pointer;
    transition: opacity 0.2s;
    display: flex; align-items: center; gap: 10px;
  }
  .logo:hover { opacity: 0.75; }
  .logo-img {
    width: 36px; height: 36px;
    border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(127,255,110,0.35);
    display: block; flex-shrink: 0;
  }
  /* breadcrumb shown inside visualizer */
  .breadcrumb {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem; font-weight: 700;
    color: #fff; letter-spacing: -1px;
    display: none; align-items: center; gap: 6px;
    cursor: pointer; transition: opacity 0.2s;
  }
  .breadcrumb:hover { opacity: 0.75; }
  .breadcrumb.show { display: flex; }
  .breadcrumb-sep { color: var(--muted); font-weight: 400; }
  .breadcrumb-page { color: var(--accent); }

  /* ── FOOTER ── */
  footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    text-align: center; padding: 14px;
    font-family: 'Space Mono', monospace; font-size: 0.7rem;
    color: #fff; letter-spacing: 0.15em;
    border-top: 1px solid var(--border);
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
  }

  /* ── HOME ── */
  #page-home {
    position: relative; z-index: 1;
    min-height: 100vh;
    padding: 100px 40px 80px;
    display: none; flex-direction: column;
  }
  #page-home.active { display: flex; }
  .home-title {
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 800; line-height: 1;
    margin-top: 20px;
  }
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px; margin-top: 60px; max-width: 900px;
  }
  .card {
    position: relative;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 40px 32px;
    cursor: pointer; overflow: hidden;
    transition: border-color 0.25s, transform 0.25s;
    text-decoration: none; color: inherit; display: block;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(127,255,110,0.07), transparent 60%);
    opacity: 0; transition: opacity 0.3s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .card:hover::before { opacity: 1; }
  .card-title { font-size: 1.6rem; font-weight: 800; }
  .card-arrow {
    position: absolute; bottom: 24px; right: 28px;
    font-size: 1.4rem; color: var(--accent);
    opacity: 0; transform: translate(-6px, 6px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .card:hover .card-arrow { opacity: 1; transform: translate(0,0); }

  /* ── VISUALIZER PAGE ── */
  #page-visualizer {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    padding: 80px 40px 70px;
    flex-direction: column; align-items: center;
    gap: 12px; overflow: hidden;
  }
  #page-visualizer.active { display: flex; }

  /* controls row */
  .vis-controls {
    display: flex; gap: 10px;
    flex-wrap: wrap; justify-content: center; align-items: center;
  }
  .btn {
    font-family: 'Space Mono', monospace; font-size: 0.72rem;
    padding: 9px 18px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    cursor: pointer; border-radius: 2px;
    letter-spacing: 0.08em;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .btn:hover, .btn.active {
    border-color: var(--accent);
    background: rgba(127,255,110,0.1); color: var(--accent);
  }
  .btn.danger { border-color: rgba(255,78,78,0.3); }
  .btn.danger:hover { border-color: #ff4e4e; background: rgba(255,78,78,0.1); color: #ff4e4e; }

  /* sensitivity slider */
  .slider-row {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Space Mono', monospace; font-size: 0.62rem;
    color: var(--muted); letter-spacing: 0.1em;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 120px; height: 3px;
    background: var(--border); border-radius: 2px;
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 6px var(--accent);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    border: none; box-shadow: 0 0 6px var(--accent);
  }
  #sens-val { color: var(--accent); min-width: 26px; text-align: right; }

  /* colour panel */
  .color-panel {
    display: none; flex-wrap: wrap; gap: 10px;
    justify-content: center; align-items: center;
    padding: 14px 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; width: 100%; max-width: 900px;
  }
  .color-panel.open { display: flex; }
  .preset-btn {
    font-family: 'Space Mono', monospace; font-size: 0.63rem;
    padding: 7px 16px; border-radius: 2px; cursor: pointer;
    border: 1px solid transparent; letter-spacing: 0.08em;
    transition: transform 0.15s, border-color 0.15s;
    color: #fff; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
  .preset-btn:hover { transform: scale(1.05); }
  .preset-btn.selected { border-color: #fff; }
  .color-divider {
    width: 1px; height: 28px;
    background: var(--border); margin: 0 4px;
  }
  .custom-colors { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .color-pick-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: 'Space Mono', monospace; font-size: 0.52rem;
    color: var(--muted); letter-spacing: 0.1em;
  }
  input[type=color] {
    width: 36px; height: 28px;
    border: 1px solid var(--border); border-radius: 2px;
    background: none; cursor: pointer; padding: 2px;
  }

  /* canvas */
  #canvas-wrap {
    width: 100%; max-width: 900px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden;
    position: relative; flex: 1; min-height: 0;
    cursor: default;
  }
  #canvas-wrap.circle-mode { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }

  /* hover hint overlay for circle mode */
  #img-hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-family: 'Space Mono', monospace; font-size: 0.58rem;
    color: var(--muted); letter-spacing: 0.14em;
    pointer-events: none; white-space: nowrap;
    opacity: 0; transition: opacity 0.25s;
  }
  #canvas-wrap.circle-mode:hover #img-hint { opacity: 1; }

  /* bottom status row */
  .bottom-row {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 900px;
  }
  .vis-mode-label {
    font-family: 'Space Mono', monospace; font-size: 0.6rem;
    color: var(--muted); letter-spacing: 0.2em;
  }
  .color-label-txt {
    font-family: 'Space Mono', monospace; font-size: 0.6rem;
    color: var(--muted); letter-spacing: 0.12em;
  }
  .status-dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--muted);
    margin-right: 8px; vertical-align: middle;
    transition: background 0.3s;
  }
  .status-dot.live {
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="pw-screen" style="
  position:fixed;inset:0;z-index:9999;background:#0a0a0f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
  <div style="font-family:'Space Mono',monospace;font-size:1.4rem;color:#fff;letter-spacing:0.1em;">TK_Thomas</div>
  <div style="font-family:'Space Mono',monospace;font-size:0.7rem;color:#555570;letter-spacing:0.2em;margin-bottom:8px;">PASSWORT EINGEBEN</div>
  <input id="pw-input" type="password" placeholder="••••••" autofocus
    style="background:#111118;border:1px solid #1e1e2e;color:#fff;font-family:'Space Mono',monospace;
           font-size:1rem;padding:12px 24px;border-radius:2px;outline:none;text-align:center;
           letter-spacing:0.3em;width:220px;transition:border-color 0.2s;"
    onkeydown="if(event.key==='Enter')checkPw()"
    oninput="this.style.borderColor='#1e1e2e'">
  <div id="pw-error" style="font-family:'Space Mono',monospace;font-size:0.65rem;color:#ff4e4e;letter-spacing:0.15em;height:16px;"></div>
  <button onclick="checkPw()" style="font-family:'Space Mono',monospace;font-size:0.75rem;
    padding:10px 28px;border:1px solid #1e1e2e;background:#111118;color:#fff;cursor:pointer;
    border-radius:2px;letter-spacing:0.1em;transition:border-color 0.2s;"
    onmouseover="this.style.borderColor='#fff'" onmouseout="this.style.borderColor='#1e1e2e'">ENTER</button>
</div>

<!-- HEADER -->
<header>
  <div class="logo" id="logo-home" onclick="goHome()">
    <img
      src="https://media.discordapp.net/attachments/1373683320793075823/1478113499245838570/IMG_8139.jpeg?ex=69a737f8&is=69a5e678&hm=ddcc0d2ab439e6dff90e6f4d94420ec895440ae90835ee70dbab49baca06019f&=&format=webp&width=934&height=930"
      class="logo-img" alt="TK"
      onerror="this.style.display='none'">
    TK<span style="color:#fff">_</span>Thomas
  </div>
  <div class="breadcrumb" id="logo-vis" onclick="goHome()">
    <img
      src="https://media.discordapp.net/attachments/1373683320793075823/1478113499245838570/IMG_8139.jpeg?ex=69a737f8&is=69a5e678&hm=ddcc0d2ab439e6dff90e6f4d94420ec895440ae90835ee70dbab49baca06019f&=&format=webp&width=934&height=930"
      class="logo-img" alt="TK"
      onerror="this.style.display='none'">
    TK<span style="color:#fff">_</span>Thomas
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-page">Visualizer</span>
  </div>
</header>

<footer>Made by <span>TK_Thomas</span></footer>

<!-- HOME PAGE -->
<div id="page-home" class="active">
  <div class="home-title">Projects</div>
  <div class="projects-grid">
    <div class="card" onclick="showVisualizer()">
      <div class="card-title">Sound<br>Visualizer</div>
      <div class="card-arrow">↗</div>
    </div>
    <a class="card" href="https://tk-thomas.github.io/rezepte/" target="_blank">
      <div class="card-title">Rezepte</div>
      <div class="card-arrow">↗</div>
    </a>
  </div>
</div>

<!-- VISUALIZER PAGE -->
<div id="page-visualizer">

  <!-- Row 1: transport + modes + colour + fullscreen -->
  <div class="vis-controls">
    <button class="btn" id="btn-start" onclick="startMic()">▶ Start</button>
    <button class="btn danger" id="btn-stop" onclick="stopMic()" style="display:none">■ Stop</button>

    <button class="btn active" id="mode-bars"   onclick="setMode('bars')">Bars</button>
    <button class="btn"        id="mode-wave"   onclick="setMode('wave')">Wave</button>
    <button class="btn"        id="mode-circle" onclick="setMode('circle')">Circle</button>

    <button class="btn" id="btn-colors" onclick="toggleColors()">🎨 Farben</button>
    <button class="btn" onclick="toggleFullscreen()" title="Vollbild">⛶</button>
  </div>

  <!-- Row 2: sensitivity -->
  <div class="slider-row">
    EMPFINDLICHKEIT
    <input type="range" id="sens-slider" min="0.5" max="5" step="0.1" value="1"
           oninput="sensitivity=+this.value; document.getElementById('sens-val').textContent=(+this.value).toFixed(1)">
    <span id="sens-val">1.0</span>
  </div>

  <!-- Row 3: colour panel (collapsed by default) -->
  <div class="color-panel" id="color-panel">
    <button class="preset-btn selected" id="preset-0"
      style="background:linear-gradient(90deg,#7fff6e,#ff6ef7,#6ef7ff)"
      onclick="applyPreset(0)">NEON</button>
    <button class="preset-btn" id="preset-1"
      style="background:linear-gradient(90deg,#ff4e4e,#ff9d00,#ffe600)"
      onclick="applyPreset(1)">LAVA</button>
    <button class="preset-btn" id="preset-2"
      style="background:linear-gradient(90deg,#4e8bff,#a56eff,#ff6ef7)"
      onclick="applyPreset(2)">GALAXY</button>

    <div class="color-divider"></div>

    <div class="custom-colors">
      <div class="color-pick-wrap">
        START
        <input type="color" id="col-a" value="#7fff6e" oninput="applyCustom()">
      </div>
      <div class="color-pick-wrap">
        MID
        <input type="color" id="col-b" value="#ff6ef7" oninput="applyCustom()">
      </div>
      <div class="color-pick-wrap">
        END
        <input type="color" id="col-c" value="#6ef7ff" oninput="applyCustom()">
      </div>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <canvas id="vis-canvas"></canvas>
    <div id="img-hint">KLICK → BILD WÄHLEN</div>
    <input type="file" id="img-input" accept="image/*" style="display:none" onchange="loadCircleImage(event)">
  </div>

  <!-- Bottom status -->
  <div class="bottom-row">
    <div class="vis-mode-label">
      <span class="status-dot" id="dot"></span><span id="mode-label">MODE: BARS</span>
    </div>
    <div class="color-label-txt" id="color-label">NEON</div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   PASSWORD
═══════════════════════════════════════════ */
function checkPw() {
  const inp = document.getElementById('pw-input');
  if (inp.value === 'TK') {
    document.getElementById('pw-screen').style.display = 'none';
  } else {
    inp.style.borderColor = '#ff4e4e';
    document.getElementById('pw-error').textContent = 'FALSCHES PASSWORT';
    inp.value = '';
    setTimeout(() => document.getElementById('pw-error').textContent = '', 2000);
  }
}

/* ═══════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════ */
function goHome() {
  document.getElementById('page-home').classList.add('active');
  document.getElementById('page-visualizer').classList.remove('active');
  document.getElementById('logo-home').style.display = '';
  document.getElementById('logo-vis').classList.remove('show');
  stopMic();
}
function showVisualizer() {
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-visualizer').classList.add('active');
  document.getElementById('logo-home').style.display = 'none';
  document.getElementById('logo-vis').classList.add('show');
  resize();
}

/* ═══════════════════════════════════════════
   COLOUR SYSTEM
═══════════════════════════════════════════ */
const PRESETS = [
  { name:'NEON',   a:[127,255,110], b:[255,110,247], c:[110,247,255] },
  { name:'LAVA',   a:[255,78,78],   b:[255,157,0],   c:[255,230,0]   },
  { name:'GALAXY', a:[78,139,255],  b:[165,110,255], c:[255,110,247] },
];
let colorA = [...PRESETS[0].a];
let colorB = [...PRESETS[0].b];
let colorC = [...PRESETS[0].c];

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1,3),16),
    parseInt(hex.slice(3,5),16),
    parseInt(hex.slice(5,7),16),
  ];
}
function rgbToHex([r,g,b]) {
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lerpColor(a, b, t) {
  return [
    Math.round(a[0]+(b[0]-a[0])*t),
    Math.round(a[1]+(b[1]-a[1])*t),
    Math.round(a[2]+(b[2]-a[2])*t),
  ];
}
function getGradientColor(t) {          // t in [0,1]
  if (t < 0.5) return lerpColor(colorA, colorB, t*2);
  return lerpColor(colorB, colorC, (t-0.5)*2);
}
function toRgb([r,g,b])     { return `rgb(${r},${g},${b})`; }
function toRgba([r,g,b],a)  { return `rgba(${r},${g},${b},${a})`; }

function applyPreset(i) {
  const p = PRESETS[i];
  colorA = [...p.a]; colorB = [...p.b]; colorC = [...p.c];
  document.querySelectorAll('.preset-btn').forEach((b,j)=>b.classList.toggle('selected',j===i));
  document.getElementById('color-label').textContent = p.name;
  document.getElementById('col-a').value = rgbToHex(colorA);
  document.getElementById('col-b').value = rgbToHex(colorB);
  document.getElementById('col-c').value = rgbToHex(colorC);
}
function applyCustom() {
  colorA = hexToRgb(document.getElementById('col-a').value);
  colorB = hexToRgb(document.getElementById('col-b').value);
  colorC = hexToRgb(document.getElementById('col-c').value);
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('selected'));
  document.getElementById('color-label').textContent = 'CUSTOM';
}
function toggleColors() {
  document.getElementById('color-panel').classList.toggle('open');
  document.getElementById('btn-colors').classList.toggle('active',
    document.getElementById('color-panel').classList.contains('open'));
}

/* ═══════════════════════════════════════════
   CANVAS / RESIZE
═══════════════════════════════════════════ */
const canvas   = document.getElementById('vis-canvas');
const ctx      = canvas.getContext('2d');
let dpr        = window.devicePixelRatio || 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth  * dpr;
  canvas.height = canvas.offsetHeight * dpr;
}
window.addEventListener('resize', resize);
document.addEventListener('fullscreenchange', () => setTimeout(resize, 80));
resize();

/* ═══════════════════════════════════════════
   FULLSCREEN
═══════════════════════════════════════════ */
function toggleFullscreen() {
  const wrap = document.getElementById('canvas-wrap');
  if (!document.fullscreenElement) {
    wrap.requestFullscreen && wrap.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen && document.exitFullscreen();
  }
}

/* ═══════════════════════════════════════════
   CIRCLE IMAGE UPLOAD
═══════════════════════════════════════════ */
let circleImage = null;

document.getElementById('canvas-wrap').addEventListener('click', () => {
  if (mode === 'circle') document.getElementById('img-input').click();
});

function loadCircleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { circleImage = img; };
  img.src = url;
  e.target.value = '';   // allow re-selecting same file
}

/* ═══════════════════════════════════════════
   AUDIO ENGINE
═══════════════════════════════════════════ */
let audioCtx, analyser, source, stream, raf;
let mode        = 'bars';
let sensitivity = 1;

async function startMic() {
  try {
    stream   = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source   = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-stop').style.display  = '';
    document.getElementById('dot').classList.add('live');
    if (raf) cancelAnimationFrame(raf);
    draw();
  } catch(e) {
    alert('Kein Mikrofon-Zugriff: ' + e.message);
  }
}
function stopMic() {
  if (raf)      cancelAnimationFrame(raf);
  if (stream)   stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  audioCtx = analyser = source = stream = raf = null;
  document.getElementById('btn-start').style.display = '';
  document.getElementById('btn-stop').style.display  = 'none';
  document.getElementById('dot').classList.remove('live');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ═══════════════════════════════════════════
   MODE SWITCH
═══════════════════════════════════════════ */
function setMode(m) {
  mode = m;
  ['bars','wave','circle'].forEach(id => {
    document.getElementById('mode-'+id).classList.toggle('active', id===m);
  });
  document.getElementById('mode-label').textContent = 'MODE: ' + m.toUpperCase();
  const wrap = document.getElementById('canvas-wrap');
  if (m === 'circle') {
    wrap.classList.add('circle-mode');
  } else {
    wrap.classList.remove('circle-mode');
  }
}

/* ═══════════════════════════════════════════
   DRAW LOOP
═══════════════════════════════════════════ */
function getAudioData() {
  const len = analyser ? analyser.frequencyBinCount : 128;
  const buf = new Uint8Array(len);
  if (!analyser) return buf;
  if (mode === 'wave') {
    analyser.getByteTimeDomainData(buf);
  } else {
    analyser.getByteFrequencyData(buf);
  }
  return buf;
}

function applyBoost(buf) {
  return Array.from(buf).map(v => {
    if (mode === 'wave') {
      const c = (v - 128) * sensitivity;
      return Math.max(-128, Math.min(127, c)) + 128;
    }
    return Math.min(255, v * sensitivity);
  });
}

function draw() {
  raf = requestAnimationFrame(draw);
  const W = canvas.width, H = canvas.height;
  const raw      = getAudioData();
  const boosted  = applyBoost(raw);

  ctx.clearRect(0, 0, W, H);

  /* ─── BARS ─── */
  if (mode === 'bars') {
    const bw = W / boosted.length;
    boosted.forEach((val, i) => {
      const t   = i / boosted.length;
      const h   = (val / 255) * H;
      const col = getGradientColor(t);
      const grd = ctx.createLinearGradient(0, H-h, 0, H);
      grd.addColorStop(0, toRgba(col, 0.9));
      grd.addColorStop(1, toRgba(col, 0.25));
      ctx.fillStyle = grd;
      ctx.fillRect(i * bw, H - h, bw - 1, h);
    });

  /* ─── WAVE ─── */
  } else if (mode === 'wave') {
    const step = W / (boosted.length - 1);

    ctx.beginPath();
    boosted.forEach((val, i) => {
      const x = i * step;
      const y = (val / 256) * H;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    const grd = ctx.createLinearGradient(0,0,W,0);
    grd.addColorStop(0,   toRgb(colorA));
    grd.addColorStop(0.5, toRgb(colorB));
    grd.addColorStop(1,   toRgb(colorC));
    ctx.strokeStyle = grd;
    ctx.lineWidth   = 2.5 * dpr;
    ctx.stroke();

    // translucent fill under wave
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    const fillGrd = ctx.createLinearGradient(0,0,W,0);
    fillGrd.addColorStop(0,   toRgba(colorA, 0.15));
    fillGrd.addColorStop(0.5, toRgba(colorB, 0.15));
    fillGrd.addColorStop(1,   toRgba(colorC, 0.15));
    ctx.fillStyle = fillGrd;
    ctx.fill();

  /* ─── CIRCLE ─── */
  } else if (mode === 'circle') {
    const cx    = W / 2, cy = H / 2;
    const baseR = Math.min(W, H) * 0.22;
    const imgR  = baseR * 0.82;

    // frequency spikes
    boosted.forEach((val, i) => {
      const t     = i / boosted.length;
      const angle = t * Math.PI * 2 - Math.PI / 2;
      const len   = (val / 255) * baseR * 1.1;
      const col   = getGradientColor(t);
      const x1    = cx + Math.cos(angle) * baseR;
      const y1    = cy + Math.sin(angle) * baseR;
      const x2    = cx + Math.cos(angle) * (baseR + len);
      const y2    = cy + Math.sin(angle) * (baseR + len);
      ctx.beginPath();
      ctx.strokeStyle = toRgba(col, 0.85);
      ctx.lineWidth   = 2 * dpr;
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.stroke();
    });

    // outer ring
    ctx.beginPath();
    ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
    ctx.strokeStyle = toRgba(colorB, 0.35);
    ctx.lineWidth   = 1.5 * dpr;
    ctx.stroke();

    // centre circle (clipped)
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, imgR, 0, Math.PI * 2);
    ctx.clip();

    if (circleImage) {
      const side = imgR * 2;
      ctx.drawImage(circleImage, cx - imgR, cy - imgR, side, side);
    } else {
      ctx.fillStyle = 'rgba(17,17,24,0.9)';
      ctx.fill();
    }
    ctx.restore();

    // border & "+" hint when no image
    if (!circleImage) {
      ctx.beginPath();
      ctx.setLineDash([5*dpr, 5*dpr]);
      ctx.arc(cx, cy, imgR, 0, Math.PI * 2);
      ctx.strokeStyle = toRgba(colorB, 0.55);
      ctx.lineWidth   = 1.5 * dpr;
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.save();
      ctx.font          = `bold ${Math.round(imgR * 0.38)}px 'Space Mono', monospace`;
      ctx.fillStyle     = toRgba(colorB, 0.55);
      ctx.textAlign     = 'center';
      ctx.textBaseline  = 'middle';
      ctx.fillText('+', cx, cy);
      ctx.restore();
    } else {
      // thin solid border over image
      ctx.beginPath();
      ctx.arc(cx, cy, imgR, 0, Math.PI * 2);
      ctx.strokeStyle = toRgba(colorB, 0.4);
      ctx.lineWidth   = 1.5 * dpr;
      ctx.stroke();
    }
  }
}

/* start idle loop so circle placeholder renders before mic starts */
(function idleLoop() {
  if (!analyser) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    if (mode === 'circle') {
      const cx = W/2, cy = H/2;
      const baseR = Math.min(W,H)*0.22;
      const imgR  = baseR*0.82;

      ctx.beginPath(); ctx.arc(cx,cy,baseR,0,Math.PI*2);
      ctx.strokeStyle = toRgba(colorB,0.25); ctx.lineWidth=1.5*dpr; ctx.stroke();

      ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,imgR,0,Math.PI*2); ctx.clip();
      if (circleImage) {
        ctx.drawImage(circleImage, cx-imgR, cy-imgR, imgR*2, imgR*2);
      } else {
        ctx.fillStyle='rgba(17,17,24,0.9)'; ctx.fill();
      }
      ctx.restore();

      if (!circleImage) {
        ctx.beginPath(); ctx.setLineDash([5*dpr,5*dpr]);
        ctx.arc(cx,cy,imgR,0,Math.PI*2);
        ctx.strokeStyle=toRgba(colorB,0.5); ctx.lineWidth=1.5*dpr; ctx.stroke(); ctx.setLineDash([]);
        ctx.save();
        ctx.font=`bold ${Math.round(imgR*0.38)}px 'Space Mono',monospace`;
        ctx.fillStyle=toRgba(colorB,0.5); ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('+',cx,cy); ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(cx,cy,imgR,0,Math.PI*2);
        ctx.strokeStyle=toRgba(colorB,0.4); ctx.lineWidth=1.5*dpr; ctx.stroke();
      }
    }
  }
  requestAnimationFrame(idleLoop);
})();
</script>
</body>
